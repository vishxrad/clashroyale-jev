<!doctype html>
<!-- Match overview with explicit agent identities and independent gameplay/decision views. -->
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jev vs Laya</title>
  <style>
    :root{color-scheme:light;font:14px/1.5 Arial,Helvetica,sans-serif;background:#f3f0e8;color:#252c32}
    *{box-sizing:border-box}body{margin:0}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}
    button:disabled{color:#888981!important;background:#e4e0d6!important;border-color:#c8c4b9!important;cursor:default}
    button:focus-visible,a:focus-visible{outline:2px solid #174d87;outline-offset:4px}
    .match-bar{height:42px;margin:0 12px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #bcb8ac}
    h1{font-size:16px;line-height:1.1;font-weight:600;letter-spacing:-.5px;margin:0}.versus{color:#737268;margin:0 4px}
    .controls{display:flex;gap:8px;flex-shrink:0}
    .controls button{border:1px solid #8e928c;border-radius:0;background:#fffdf8;color:#303a42;padding:5px 12px;font-size:11px;font-weight:600}
    .controls #start{background:#174d87;color:#fff;border-color:#174d87}.controls button:hover:not(:disabled){background:#e9e4d8}.controls #start:hover:not(:disabled){background:#103d6d}
    #message{margin:10px 12px;font-size:12px;color:#a23520}
    .players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;padding:0 12px 8px}
    .player{--accent:#174d87;min-width:0;background:#f3f0e8;border:0;overflow:hidden;display:flex;flex-direction:column;height:calc(100dvh - 50px);min-height:420px}
    .player.jev{margin-right:8px}.player.laya{--accent:#b94725;padding-left:8px;border-left:1px solid #bcb8ac}
    .player-heading{height:42px;padding:0;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:2px solid var(--accent);background:#f3f0e8;flex-shrink:0}
    .identity{min-width:0;display:flex;align-items:baseline;gap:10px}.identity h2{font-size:32px;line-height:1;font-weight:800;letter-spacing:-1px;margin:0;color:var(--accent);text-transform:uppercase}
    .identity h2 a{color:inherit;text-decoration:none}.identity h2 a:hover{text-decoration:underline;text-underline-offset:3px}
    .identity .account{margin:0;font-size:11px;color:#687069;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .account-label{display:none}.player-meta{flex-shrink:0}
    .status{font-size:11px;color:#5b625e;white-space:nowrap}
    .status[data-state="running"],.status[data-state="ready"]{color:var(--accent);font-weight:700}.status[data-state="error"]{color:#a23520}
    .player-error{margin:0;background:#fae7dc;color:#8e301a;font-size:12px;padding:10px 14px;overflow-wrap:anywhere}.player-error:empty{display:none}
    iframe{display:block;border:0;width:100%;flex:1;min-height:0;background:#fffdf8}
    @media(max-width:680px){.match-bar{margin:0 10px}.players{grid-template-columns:1fr;padding:0 10px 8px;gap:16px}.player{height:calc(100dvh - 50px);min-height:480px}.player.jev{margin-right:0}.player.laya{padding-left:0;border-left:0}.identity h2{font-size:30px}#message{margin-inline:10px}}
  </style>
</head>
<body>
  <header class="match-bar">
    <h1>Jev <span class="versus">vs</span> Laya</h1>
    <div class="controls" aria-label="Both agents"><button id="start" disabled>Start both</button><button id="stop" disabled>Stop both</button></div>
  </header>
  <p id="message" role="alert" hidden></p>
  <main class="players">
    <section class="player jev" aria-labelledby="jev-name">
      <header class="player-heading">
        <div class="identity"><h2 id="jev-name"><a href="http://127.0.0.1:{{JEV_PORT}}/" target="_blank" rel="noopener" title="Jev · Typesafe API · Open individual dashboard">Jev</a></h2><p class="account"><span id="jev-account-label" class="account-label">Account</span> <span id="jev-account">Not labeled</span></p></div>
        <div class="player-meta"><span id="jev-status" class="status" role="status">Connecting</span></div>
      </header>
      <p id="jev-error" class="player-error" role="status"></p>
      <iframe title="Jev gameplay and decisions" src="http://127.0.0.1:{{JEV_PORT}}/?view=duel"></iframe>
    </section>
    <section class="player laya" aria-labelledby="laya-name">
      <header class="player-heading">
        <div class="identity"><h2 id="laya-name"><a href="http://127.0.0.1:{{LAYA_PORT}}/" target="_blank" rel="noopener" title="Laya · local model · Open individual dashboard">Laya</a></h2><p class="account"><span id="laya-account-label" class="account-label">Account</span> <span id="laya-account">Not labeled</span></p></div>
        <div class="player-meta"><span id="laya-status" class="status" role="status">Connecting</span></div>
      </header>
      <p id="laya-error" class="player-error" role="status"></p>
      <iframe title="Laya gameplay and decisions" src="http://127.0.0.1:{{LAYA_PORT}}/?view=duel"></iframe>
    </section>
  </main>
  <script>
    // Controller status is immediate; each child's video keeps its own display buffer.
    const start = document.getElementById('start'), stop = document.getElementById('stop');
    const message = document.getElementById('message');
    const names = ['jev', 'laya'];
    let busy = false, controlError = '';
    const stopReasons = {battle_finished:'Battle finished', time_limit:'Time limit reached', api_budget:'Request limit reached', request_budget:'Request limit reached', interrupted:'Stopped', user_stop:'Stopped', stopped:'Stopped'};
    function setText(node, value) { if (node.textContent !== value) node.textContent = value; }
    function show(data) {
      const players = names.map(name => data[name]);
      for (const name of names) {
        const p = data[name], status = document.getElementById(`${name}-status`);
        const state = p.error ? 'error' : p.stopping ? 'stopping' : !p.connected ? 'connecting' : p.running ? 'running' : 'ready';
        const stopped = stopReasons[p.stop_reason] || (p.stop_reason?.includes('Deployment was not confirmed') ? 'Unconfirmed move' : 'Stopped');
        const label = {error:'Needs attention', stopping:'Stopping', connecting:'No video feed', running:'Running', ready:p.stop_reason ? stopped : 'Ready'}[state];
        setText(status, label); status.dataset.state = state;
        status.title = state === 'ready' && p.stop_reason ? stopReasons[p.stop_reason] || p.stop_reason.replaceAll('_', ' ') : label;
        setText(document.getElementById(`${name}-account-label`), p.account ? 'Playing as' : 'Account');
        setText(document.getElementById(`${name}-account`), p.account || 'Not labeled');
        setText(document.getElementById(`${name}-error`), p.error || '');
      }
      start.disabled = busy || players.some(p => !p.connected || p.running || p.stopping);
      stop.disabled = busy || !players.some(p => p.running && !p.stopping);
      setText(message, controlError);
      message.hidden = !controlError;
    }
    async function poll() {
      try { const r = await fetch('/api/duel'); if (!r.ok) throw Error('Dashboard unavailable'); show(await r.json()); }
      catch (e) {
        start.disabled = stop.disabled = true;
        setText(message, 'Connection to the dashboard was lost. Reconnecting…');
        message.hidden = false;
        for (const name of names) { const status = document.getElementById(`${name}-status`); setText(status, 'Reconnecting'); status.dataset.state = 'connecting'; }
      }
      setTimeout(poll, 1000);
    }
    for (const action of ['start', 'stop']) document.getElementById(action).onclick = async () => {
      busy = true; controlError = ''; start.disabled = stop.disabled = true;
      message.hidden = true;
      try {
        const r = await fetch(`/api/duel/${action}`, {method:'POST'}), data = await r.json();
        if (!r.ok) throw Error(data.error || 'Control request failed');
        busy = false; show(data);
      } catch (e) { controlError = e.message; setText(message, controlError); message.hidden = false; }
      finally { busy = false; }
    };
    poll();
  </script>
</body>
</html>
