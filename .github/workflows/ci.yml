name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: uv sync --locked --python 3.12
      - name: Python tests
        run: uv run pytest -q
      - name: Lint and formatting
        run: |
          uv run ruff check src scripts tests
          uv run ruff format --check src scripts tests
      - name: JavaScript checks
        run: |
          node --check src/clash_jev/static/app.js
          node --test tests/replay-state.test.mjs
      - name: Offline replay
        run: uv run clash-jev --config config/synthetic.json replay fixtures/synthetic/episode --output runs/ci-demo
      - name: Build package
        run: uv build
